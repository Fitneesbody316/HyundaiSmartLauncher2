plugins { id 'com.android.application' }

android {
    namespace 'com.hyundai.smartlauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hyundai.smartlauncher'
        minSdk 25
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
